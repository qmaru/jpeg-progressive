<!DOCTYPE html>
<html>

<head>
    <meta http-equiv="cache-control" content="no-cache, no-store">
    <link rel="icon" href="images/favicon.ico" />
    <title>Progressive Image Format Demo</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            background-color: #f0f0f0;
            font-family: monospace;
        }

        .controls {
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .masonry {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-gap: 10px;
            width: 600px;
            margin: 0 auto;
            justify-content: center;
            align-items: start;
        }

        .masonry img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            object-fit: contain;
            max-height: 200px;
        }
    </style>
</head>

<body>
    <div class="controls">
        <label for="formatSelect">Format:</label>
        <select id="formatSelect">
            <option value="jpeg">JPEG (progressive)</option>
            <option value="webp">WebP</option>
            <option value="avif">AVIF</option>
            <option value="png">PNG</option>
            <option value="jxl">JXL</option>
        </select>
    </div>

    <div class="masonry" id="masonry"></div>

    <script>
        const formatSelect = document.getElementById("formatSelect");
        const masonryContainer = document.getElementById("masonry");

        const imageCount = 100;

        function getImageUrl(format) {
            return `images/masonry/1.${format}`;
        }

        function clearImages() {
            masonryContainer.innerHTML = "";
        }

        function loadImages(format, count) {
            const baseUrl = getImageUrl(format);

            for (let i = 0; i < count; i++) {
                const randomParam = `?nocache=${Date.now()}_${Math.random()}`;
                const img = document.createElement("img");
                img.src = baseUrl + randomParam;
                img.loading = "lazy";
                masonryContainer.appendChild(img);
            }
        }

        function reload(format) {
            clearImages();
            loadImages(format, imageCount);
        }

        formatSelect.addEventListener("change", () => {
            const format = formatSelect.value;
            reload(format);
        });

        // Initial load
        reload(formatSelect.value);
    </script>
</body>

</html>
